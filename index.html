<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>GestureBloom · 手势花开</title>
<meta name="description" content="对着摄像头捏合拇指与食指控制花开，张开手掌快速挥动在四幅花之间切换。手部识别完全在浏览器本地运行，视频不上传。" />
<meta property="og:title" content="GestureBloom · 手势花开" />
<meta property="og:description" content="捏合控制花开，挥手切换四幅花。纯浏览器端手部识别，打开即用。" />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://gesturebloom.framesecond.uk/" />
<meta name="theme-color" content="#FFFFFF" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ffffff'/%3E%3Cg fill='%23e879ae'%3E%3Cellipse cx='32' cy='19' rx='8' ry='14'/%3E%3Cellipse cx='32' cy='19' rx='8' ry='14' transform='rotate(72 32 32)'/%3E%3Cellipse cx='32' cy='19' rx='8' ry='14' transform='rotate(144 32 32)'/%3E%3Cellipse cx='32' cy='19' rx='8' ry='14' transform='rotate(216 32 32)'/%3E%3Cellipse cx='32' cy='19' rx='8' ry='14' transform='rotate(288 32 32)'/%3E%3C/g%3E%3Ccircle cx='32' cy='32' r='6.5' fill='%23f2c230'/%3E%3C/svg%3E" />
<!-- 字体自托管：不再引 Google Fonts（那条外链会阻塞首屏渲染） -->
<link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
<!-- 手势识别模块提前预热，省掉 JS 解析后才开始下载的串行等待 -->
<link rel="modulepreload" href="assets/mediapipe/vision_bundle.js" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- 背景：由画面左右边缘横向延展，填满两侧 -->
<canvas id="bg" aria-hidden="true"></canvas>

<!-- 主体：9:16 竖版画面，铺满高度；切换时在这里做缩放淡入淡出 -->
<div class="frame" id="frame">
  <canvas id="fg"></canvas>
</div>

<!-- 场景指示 -->
<div class="dots" id="dots" aria-hidden="true"></div>

<!-- 底部按钮 -->
<div class="dock" role="group" aria-label="控制">
  <button class="btn is-on" id="btnGesture">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 12V6.5a1.5 1.5 0 0 1 3 0V12"/><path d="M11 11V5.5a1.5 1.5 0 0 1 3 0V12"/><path d="M14 11.5V7a1.5 1.5 0 0 1 3 0v7.5a6 6 0 0 1-6 6h-1.2a5 5 0 0 1-3.9-1.9L4 15.6a1.6 1.6 0 0 1 2.4-2.1L8 15"/></svg>
    <span>检测手势</span>
    <i class="dot"></i>
  </button>

  <button class="btn" id="btnPrev" title="上一个">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6.5 9 12l5.5 5.5"/></svg>
  </button>

  <button class="btn" id="btnPlay">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5c2.2 2.4 3.3 4.6 3.3 6.6 0 1.6-1 2.9-2.4 2.9s-2.2-1.2-2.2-2.6c0-1.7 1.2-3.2 1.2-3.2"/><path d="M12 13.6c2.6 0 4.7 1.9 4.7 4.4 0 1.6-1.3 2.9-2.9 2.9H10.2c-1.6 0-2.9-1.3-2.9-2.9 0-2.5 2.1-4.4 4.7-4.4z"/></svg>
    <span>播放花开</span>
  </button>

  <button class="btn" id="btnNext" title="下一个">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6.5 15 12l-5.5 5.5"/></svg>
  </button>

  <button class="btn" id="btnCalibrate">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="1.6"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/></svg>
    <span>校准</span>
  </button>

  <button class="btn icon" id="btnCam" aria-pressed="false" title="摄像头预览">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6.5" width="13" height="11" rx="2.2"/><path d="M16 11l4-2.2v6.4L16 13z"/></svg>
  </button>
</div>

<!-- 摄像头预览 + 骨架 + 实时读数 -->
<section class="debug" id="debug" data-hidden="true">
  <div class="debug-media">
    <video id="cam" playsinline muted autoplay></video>
    <canvas id="skeleton"></canvas>
    <span class="pct" id="pct">0%</span>
    <div class="cam-state" id="camState" data-tone="wait">
      <i class="cam-state-dot"></i>
      <span class="cam-state-text">正在开启摄像头…</span>
    </div>
  </div>
</section>

<div class="err" id="err" hidden>
  <b>素材没有加载出来</b>
  请通过本地服务器（<code>python3 serve.py</code>）或线上地址打开，不要直接双击 index.html
</div>

<div class="toast" id="toast"></div>

<script src="js/gesture.js?v=6"></script>
<script src="js/stage.js?v=6"></script>
<script src="js/main.js?v=6"></script>
</body>
</html>
